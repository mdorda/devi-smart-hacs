get_schedule:
  name: Get weekly schedule
  description: Return the raw weekly schedule and away interval for one or more DEVI thermostats.
  target:
    entity:
      integration: devi
      domain: climate
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: devi
          domain: climate

set_weekly_schedule:
  name: Set weekly schedule
  description: Write the raw weekly schedule (week_1 28 bytes, week_2 42 bytes, as get_schedule returns them) to one or more DEVI thermostats.
  target:
    entity:
      integration: devi
      domain: climate
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: devi
          domain: climate
    week_1_hex:
      required: true
      example: "1000203040"
      selector:
        text:
    week_2_hex:
      required: true
      example: "50607080"
      selector:
        text:
